<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerçek Hesaplama Zorlamalı Makine</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .calculator { background-color: #222; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 0 20px rgba(255,0,0,0.2); }
        #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 15px; background-color: #333; color: #fff; border: none; border-radius: 5px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; background-color: #444; color: white; }
        button.operator { background-color: #d9534f; }
    </style>
</head>
<body>

<div class="calculator">
    <div style="color: #ff3333; font-size: 11px; margin-bottom: 5px;">🔥 GERÇEK HESAPLAMA ZORLAMASI</div>
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="calculate()" class="operator">=</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('0')">0</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }

    function calculate() {
        let expression = display.value;
        
        // Eğer kullanıcı bir sayıyı 0'a bölmek isterse (Örn: 4/0)
        if (expression.includes('/0')) {
            let bolunen = parseFloat(expression.split('/')[0]);
            
            display.value = "HESAPLANIYOR...";
            
            // Sıfıra yaklaşmak için başlangıç böleni
            let bolen = 1.0; 
            
            // Bilgisayar burada yapay bir döngü yapmıyor. 
            // Böleni sürekli küçülterek sıfıra ulaşmaya ve gerçek bölme işlemi yapmaya çalışıyor.
            while (bolen > 0) {
                let sonuc = bolunen / bolen; 
                bolen = bolen / 1.0000001; // Böleni her adımda sıfıra inanılmaz küçük adımlarla yaklaştırıyoruz
                
                // JavaScript'in sayısal sınırı olan en küçük pozitif sayıya ulaşıldığında bile 
                // döngü teknik olarak bitmeye çalışacak ama işlemci milyarlarca kez bölme yapmaktan kilitlenecek.
            }
        }

        // Diğer normal işlemler
        try {
            display.value = eval(expression);
        } catch (e) {
            display.value = 'Hata';
        }
    }
</script>

</body>
</html>
